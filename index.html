<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOMOgiciels</title>
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gris:#808080; --texte:#4a4a4a; --S:250px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#fff;color:var(--texte);overflow:hidden;
    font-family:"Comfortaa","Segoe UI",system-ui,sans-serif}

  /* ---------- Le MM : d'abord net au centre, puis surface lointaine ---------- */
  #bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    perspective:1100px;pointer-events:none;z-index:0}
  #mm{width:min(46vw,40vh);height:auto;overflow:visible;
    transition:transform 2.2s cubic-bezier(.65,0,.25,1),filter 2.2s ease,opacity 2.2s ease}
  #mm path{fill:var(--gris);transition:fill 2.2s ease}
  #mm .pA{animation:slideA 1.2s cubic-bezier(.2,.8,.2,1) both}
  #mm .pB{animation:slideB 1.2s cubic-bezier(.2,.8,.2,1) both}
  @keyframes slideA{from{transform:translateX(-1500px);opacity:0}50%{opacity:1}to{transform:none;opacity:1}}
  @keyframes slideB{from{transform:translateX(1500px);opacity:0}50%{opacity:1}to{transform:none;opacity:1}}
  #mm.far{transform:translateZ(-520px) rotateX(62deg) rotateZ(-34deg) scale(1.9);
    filter:blur(7px);opacity:.55}
  #mm.far path{fill:#b4b4b4}

  /* ---------- Les bulles ---------- */
  #bubbles{position:fixed;inset:0;z-index:1;pointer-events:none}
  .bub{position:absolute;width:var(--S);height:var(--S);display:block;text-decoration:none;
    pointer-events:auto;outline:none;-webkit-tap-highlight-color:transparent;
    opacity:0;transform:scale(.6);transition:opacity .9s ease,transform 1.1s cubic-bezier(.3,1.4,.5,1)}
  .bub.in{opacity:1;transform:none}
  .float{position:absolute;inset:0;animation:float var(--fd,7s) ease-in-out var(--fdel,0s) infinite alternate}
  @keyframes float{
    0%{transform:translate(0,0)}
    50%{transform:translate(var(--fx,6px),-12px)}
    100%{transform:translate(calc(var(--fx,6px) * -1),6px)}
  }
  .ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
    animation:spin var(--rd,48s) linear infinite}
  .ring.rev{animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring text{font-family:"Comfortaa",sans-serif;font-size:13px;font-weight:600;fill:var(--c);
    letter-spacing:.3px;opacity:.85}
  .ball{position:absolute;left:15.5%;top:15.5%;width:69%;height:69%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.97) 58%, color-mix(in srgb, var(--c) 14%, #fff) 86%, color-mix(in srgb, var(--c) 30%, #fff) 100%);
    border:1.5px solid color-mix(in srgb, var(--c) 32%, transparent);
    transition:transform .5s cubic-bezier(.3,1.5,.5,1),border-color .3s}
  .ball img{width:60%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
  /* reflets de bulle */
  .ball::before{content:"";position:absolute;left:17%;top:11%;width:34%;height:20%;border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);
    transform:rotate(-28deg);pointer-events:none}
  .ball::after{content:"";position:absolute;inset:6%;border-radius:50%;pointer-events:none;
    border:2px solid transparent;border-bottom-color:color-mix(in srgb, var(--c) 18%, transparent);
    transform:rotate(25deg)}
  .bub:hover .ball,.bub:focus-visible .ball{transform:scale(1.08);border-color:var(--c)}
  .bub:active .ball{transform:scale(1.02)}

  /* ---------- Accroche ---------- */
  #tagline{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    width:var(--tagw,420px);text-align:center;font-size:20px;line-height:1.5;color:var(--texte);
    cursor:pointer;user-select:none;opacity:0;transition:opacity .6s}
  #tagline.on{opacity:1}
  #tagline b{font-weight:700;color:var(--gris)}
  #tagline .caret{display:inline-block;width:2px;height:1em;background:var(--gris);
    vertical-align:-2px;margin-left:3px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- Petit écran : on empile ---------- */
  html.mobile,html.mobile body{overflow-x:hidden;overflow-y:auto;height:auto;min-height:100%}
  html.mobile #bubbles{position:relative;inset:auto;display:flex;flex-wrap:wrap;justify-content:center;
    gap:10px;padding:0 6px 40px}
  html.mobile .bub{position:relative;left:auto!important;top:auto!important}
  html.mobile #tagline{position:relative;left:auto;top:auto;transform:none;margin:56px auto 18px;
    width:auto;max-width:92vw;padding:0 12px}

  @media (prefers-reduced-motion:reduce){
    .float,.ring{animation:none}
  }
</style>
</head>

/* ============ Les MOMOgiciels ============ */
const APPS = [
  {key:'cad', name:'MomoCAD', color:'#2B5B7D', url:'https://mowiss.github.io/Momocad/', desc:'Dessin technique & export DXF'},
  {key:'pic', name:'MomoPIC', color:'#AA0000', url:'https://mowiss.github.io/Momopic/', desc:'Retouche d\'images multicalques'},
  {key:'job', name:'MomoJOB', color:'#934584', url:'https://mowiss.github.io/Momojob/', desc:'Suivi & étude de chantier'},
  {key:'doc', name:'MomoDOC', color:'#FF8400', url:'https://mowiss.github.io/Momodoc/', desc:'Composition de documents'},
  {key:'top', name:'MomoTOP', color:'#528F53', url:'https://mowiss.github.io/Momotop/', desc:'Prototypage de jeux de société'}
];
const ANGLES = [-90, -18, 54, 126, 198];   /* pentagone autour de l'accroche */

const TAGLINES = [
  "À chaque problème, son MOMOgiciel.",
  "Le bon MOMOgiciel au bon moment.",
  "Une idée, un projet, un MOMOgiciel.",
  "MOMOgiciels : parce que le mot « logiciel », c'était quand même super triste.",
  "Un MOMOgiciel pour tout faire. Sauf la vaisselle (pour l'instant).",
  "Sérieusement ? Les gens lisent encore les phrases d'accroche ?",
  "Pour abattre du boulot, rien ne vaut un MOMO.",
  "Pas besoin d'avoir un gros cerveau, il suffit d'avoir le bon MOMO."
];

/* ============ Construction ============ */
const $ = s => document.querySelector(s);
const mm = $('#mm'), tagEl = $('#tagline'), bubEl = $('#bubbles');
mm.innerHTML = `<path class="pA" d="${M_A}"/><path class="pB" d="${M_B}"/>`;
$('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 845 1220"><path d="${M_A}" fill="#808080"/><path d="${M_B}" fill="#808080"/></svg>`);

/* anneau de texte : cercle r=108 dans une boîte de 260 */
const R = 108, CIRC = 2 * Math.PI * R;
const bubbles = APPS.map((a, i) => {
  const el = document.createElement('a');
  el.className = 'bub';
  el.href = a.url;
  el.setAttribute('aria-label', a.name + ' — ' + a.desc);
  el.style.setProperty('--c', a.color);
  el.style.setProperty('--fd', (6 + i * 0.9).toFixed(1) + 's');
  el.style.setProperty('--fdel', (-i * 1.7).toFixed(1) + 's');
  el.style.setProperty('--fx', (i % 2 ? -7 : 7) + 'px');
  el.style.setProperty('--rd', (44 + i * 6) + 's');
  const unit = a.desc + '   •   ';
  const reps = Math.max(1, Math.round(CIRC / (unit.length * 7.6)));
  el.innerHTML = `
    <div class="float">
      <svg class="ring${i % 2 ? ' rev' : ''}" viewBox="0 0 260 260" aria-hidden="true">
        <defs><path id="rp-${a.key}" d="M130,${130 - R} a${R},${R} 0 1,1 0,${2*R} a${R},${R} 0 1,1 0,${-2*R}"/></defs>
        <text><textPath href="#rp-${a.key}" textLength="${(CIRC - 2).toFixed(1)}" lengthAdjust="spacing">${unit.repeat(reps)}</textPath></text>
      </svg>
      <div class="ball"><img src="${LOGOS[a.key]}" alt="${a.name}" draggable="false"></div>
    </div>`;
  bubEl.appendChild(el);
  return el;
});

/* ============ Mise en page ============ */
function layout(){
  const W = innerWidth, H = innerHeight;
  const mobile = W < 720 || H < 520;
  document.documentElement.classList.toggle('mobile', mobile);
  if (mobile){
    document.documentElement.style.setProperty('--S', Math.min(W / 2 - 16, 210) + 'px');
    return;
  }
  const S = Math.max(190, Math.min(280, Math.min(W, H) * 0.3));
  document.documentElement.style.setProperty('--S', S + 'px');
  const cx = W / 2, cy = H / 2, half = S / 2, m = 8;
  const rx = Math.min(W * 0.34, 560), ry = Math.min(H * 0.36, 340);
  bubbles.forEach((el, i) => {
    const t = ANGLES[i] * Math.PI / 180;
    const x = Math.min(Math.max(cx + Math.cos(t) * rx, half + m), W - half - m);
    const y = Math.min(Math.max(cy + Math.sin(t) * ry, half + m), H - half - m);
    el.style.left = (x - half) + 'px';
    el.style.top  = (y - half) + 'px';
  });
  const free = 2 * (Math.cos(54 * Math.PI / 180) * rx) + S * 0.4;
  document.documentElement.style.setProperty('--tagw', Math.max(240, Math.min(free, 460)) + 'px');
}
addEventListener('resize', layout);
layout();

/* ============ Accroche ============ */
let lastTag = -1, typeTimer = null;
function pickTag(){
  let i; do { i = Math.floor(Math.random() * TAGLINES.length); } while (i === lastTag);
  lastTag = i; return TAGLINES[i];
}
const fmt = s => s.replace(/MOMO/g, '<b>MOMO</b>');
function typeTag(text, instant){
  clearInterval(typeTimer);
  tagEl.classList.add('on');
  if (instant){ tagEl.innerHTML = fmt(text); return; }
  let n = 0;
  typeTimer = setInterval(() => {
    n++;
    tagEl.innerHTML = fmt(text.slice(0, n)) + '<span class="caret"></span>';
    if (n >= text.length){ clearInterval(typeTimer); const id = typeTimer; setTimeout(() => { if (typeTimer === id) tagEl.innerHTML = fmt(text); }, 1000); }
  }, 32);
}
tagEl.addEventListener('click', e => { e.stopPropagation(); typeTag(pickTag()); });

/* ============ Ouverture ============ */
let done = false;
const timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const firstTag = pickTag();

function showBubbles(stagger){
  bubbles.forEach((el, i) => stagger ? later(() => el.classList.add('in'), i * 140) : el.classList.add('in'));
}
function intro(){
  later(() => mm.classList.add('far'), 1400);          /* les deux M sont superposés → la vue recule */
  later(() => showBubbles(true), 2700);                 /* les bulles arrivent au premier plan */
  later(() => { done = true; typeTag(firstTag); }, 3500);
}
function skip(){
  if (done) return;
  done = true;
  timers.forEach(clearTimeout);
  mm.querySelectorAll('path').forEach(p => p.style.animation = 'none');
  mm.style.transition = 'none';
  mm.classList.add('far');
  showBubbles(false);
  typeTag(firstTag, true);
}
document.addEventListener('click', e => { if (!e.target.closest('.bub')) skip(); });
document.addEventListener('keydown', e => { if (['Escape',' ','Enter'].includes(e.key)) skip(); });

if (matchMedia('(prefers-reduced-motion: reduce)').matches) skip(); else intro();
</script>
</body>
</html>
